allprojects {
    repositories {
        google()
        mavenCentral()
        maven {url 'https://jitpack.io'}
        // Required: Local Maven repository for tangem-sdk (bundled with plugin)
        // This is needed because the SDK is built from source while JitPack build is unavailable
        maven { url = uri("${rootProject.projectDir}/../../android/repo") }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
